{% extends "global/Page.html" %}
{% load otree static %}
{% block styles %}
<style>
     .custom-border {
        border-color: #d6d8db;
    }
 </style>
{% endblock %}
{% block title %}
What do you see?
{% endblock %}

{% block content %}
<div class="container bg-light border custom-border" style="padding-left:30px; padding-right:30px">
    <br>
    <p>
        Please consider this image and give us your first impression.
    </p>

    <p>
        <img src="{% static 'task/can.png' %}" width="500px" />
    </p>

    <p>
        {% formfields %}
    </p>

    <p>
    <!-- .otree-btn-next is the CSS/jQuery selector for this button -->
    <button class="otree-btn-next btn btn-primary">Next</button>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
    function skipPage() {
        document.getElementById('id_can').value = 'RED';
    }
</script>
{% endblock %}
