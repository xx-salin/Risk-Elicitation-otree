{% extends "global/Page.html" %}
{% load otree static %}
{% block styles %}
<style>
     .custom-border {
        border-color: #d6d8db;
    }
 </style>
{% endblock %}
{% block title %}

{% endblock %}



{% block content %}
<div class="container bg-light border custom-border" style="padding-left:30px; padding-right:30px">
    <br>
    <p>
        <img src="https://www.dropbox.com/s/na5xrgl830o9k03/FruitsLetters.png?raw=1" width="500px" />
    </p>

    <p>
        <br>
        Please type the letter that is written on the picture of the {{ fruit }}:
    </p>

    <p>
        {% formfields %}
    </p>

<br>

    <p>
    <!-- .otree-btn-next is the CSS/jQuery selector for this button -->
    <button class="otree-btn-next btn btn-primary">Next</button>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
    let fruit = js_vars.fruit;
    let fruitletter = js_vars.fruitletter;

    // Function to get the key corresponding to the fruit
    function getFruitKey(fruit) {
        for (var key in fruitletter) {
                if (fruitletter[key] === fruit) {
                    return key;
                    console.log(key);
                }
        }
        return null;

    }
    
    function skipPage() {
        var fruitKey = getFruitKey(fruit);
        document.getElementById('id_answer_fruit').value = fruitKey;
    }
</script>
{% endblock %}
